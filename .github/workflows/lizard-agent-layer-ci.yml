name: lizard-agent-layer CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-7-windows:
    name: PowerShell 7 (windows-latest, full)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - &checkout-pwsh
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - &setup-node-pwsh
        name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install schema validator
        run: npm ci --ignore-scripts

      - name: Run full CI gates
        shell: pwsh
        run: ./scripts/ci.ps1

  powershell-7-unix-base:
    name: PowerShell 7 (${{ matrix.os }}, base + focused 4/6)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - *checkout-pwsh

      - name: Require non-interactive fixture privilege
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: sudo -n true

      - name: Reject bind and device mount boundaries
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./tests/adversarial/mount-boundary-fixtures.tests.ps1 -LayerRoot . -EnablePrivilegedFixtures

      - *setup-node-pwsh

      - name: Install schema validator
        run: npm ci --ignore-scripts

      - name: Run base gates and focused shard 4 of 6
        shell: pwsh
        run: ./scripts/ci.ps1 -SkipSmoke -SkipMatrix -FocusedShardIndex 4 -FocusedShardCount 6

  powershell-7-unix-focused:
    name: PowerShell 7 (${{ matrix.os }}, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, count: 6, label: 'focused 1/6' }
          - { os: ubuntu-latest, shard: 2, count: 6, label: 'focused 2/6' }
          - { os: ubuntu-latest, shard: 3, count: 6, label: 'focused 3/6' }
          - { os: ubuntu-latest, shard: 5, count: 6, label: 'focused 5/6' }
          - { os: ubuntu-latest, shard: 6, count: 6, label: 'focused 6/6' }
          - { os: macos-latest, shard: 2, count: 6, label: 'focused 2/6' }
          - { os: macos-latest, shard: 3, count: 6, label: 'focused 3/6' }
          - { os: macos-latest, shard: 5, count: 6, label: 'focused 5/6' }
          - { os: macos-latest, shard: 6, count: 6, label: 'focused 6/6' }
          - { os: macos-latest, shard: 1, count: 42, label: 'focused json' }
          - { os: macos-latest, shard: 7, count: 42, label: 'focused install-plan-tamper' }
          - { os: macos-latest, shard: 13, count: 42, label: 'focused manifest-lifecycle' }
          - { os: macos-latest, shard: 19, count: 42, label: 'focused public-readiness' }
          - { os: macos-latest, shard: 23, count: 42, label: 'focused transaction-primitives' }
          - { os: macos-latest, shard: 24, count: 42, label: 'focused handle-bound-mutation' }
          - { os: macos-latest, shard: 25, count: 42, label: 'focused external-mutator-failclosed' }
          - { os: macos-latest, shard: 26, count: 42, label: 'focused manifest-version-consistency' }
          - { os: macos-latest, shard: 27, count: 42, label: 'focused uninstall-roundtrip' }
          - { os: macos-latest, shard: 28, count: 42, label: 'focused uninstall-tamper' }
          - { os: macos-latest, shard: 29, count: 42, label: 'focused install-uninstall-roundtrip' }
          - { os: macos-latest, shard: 30, count: 42, label: 'focused memory-modes' }
          - { os: macos-latest, shard: 31, count: 42, label: 'focused memory-mode-update' }
          - { os: macos-latest, shard: 32, count: 42, label: 'focused memory-mode-transitions' }
          - { os: macos-latest, shard: 33, count: 42, label: 'focused regulated-approval' }
          - { os: macos-latest, shard: 34, count: 42, label: 'focused routing-receipt-privacy' }
          - { os: macos-latest, shard: 35, count: 42, label: 'focused prompt-trust' }
          - { os: macos-latest, shard: 36, count: 42, label: 'focused constrained-verifier' }
          - { os: macos-latest, shard: 37, count: 42, label: 'focused signed-evidence' }
          - { os: macos-latest, shard: 38, count: 42, label: 'focused signed-loop-completion' }
          - { os: macos-latest, shard: 39, count: 42, label: 'focused signed-calibration' }
          - { os: macos-latest, shard: 40, count: 42, label: 'focused analyzer-hardening' }
          - { os: macos-latest, shard: 41, count: 42, label: 'focused git-ref-validation' }
          - { os: macos-latest, shard: 42, count: 42, label: 'focused skill-lifecycle' }

    steps:
      - *checkout-pwsh

      - *setup-node-pwsh

      - name: Install schema validator
        run: npm ci --ignore-scripts

      - name: Run focused safety shard
        shell: pwsh
        run: ./tests/run-focused.ps1 -LayerRoot . -ShardIndex ${{ matrix.shard }} -ShardCount ${{ matrix.count }}

  powershell-7-unix-smoke:
    name: PowerShell 7 (${{ matrix.os }}, smoke ${{ matrix.scenario }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, scenario: all }
          - { os: macos-latest, scenario: core }
          - { os: macos-latest, scenario: loops }
          - { os: macos-latest, scenario: overlay }
          - { os: macos-latest, scenario: standard }
          - { os: macos-latest, scenario: sidecar }

    steps:
      - *checkout-pwsh

      - *setup-node-pwsh

      - name: Install schema validator
        run: npm ci --ignore-scripts

      - name: Run smoke gate
        shell: pwsh
        run: ./tests/smoke.ps1 -LayerRoot . -Scenario '${{ matrix.scenario }}'

  powershell-7-unix-matrix:
    name: PowerShell 7 (${{ matrix.os }}, matrix ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, profile: minimal, harnesses: '', label: minimal }
          - { os: ubuntu-latest, profile: standard, harnesses: '', label: standard }
          - { os: ubuntu-latest, profile: supabase-react-finance, harnesses: '', label: supabase-react-finance }
          - { os: macos-latest, profile: minimal, harnesses: '', label: minimal }
          - { os: macos-latest, profile: standard, harnesses: '', label: standard }
          - { os: macos-latest, profile: supabase-react-finance, harnesses: 'claude-code,codex,cursor', label: 'supabase-react-finance A' }
          - { os: macos-latest, profile: supabase-react-finance, harnesses: 'gemini,generic-agents-md,github-copilot', label: 'supabase-react-finance B' }

    steps:
      - *checkout-pwsh

      - *setup-node-pwsh

      - name: Install schema validator
        run: npm ci --ignore-scripts

      - name: Run profile and harness matrix
        shell: pwsh
        run: ./scripts/matrix.ps1 -LayerRoot . -Profiles '${{ matrix.profile }}' -Harnesses '${{ matrix.harnesses }}'

  windows-powershell-5:
    name: Windows PowerShell 5.1 (full)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install schema validator
        shell: powershell
        run: npm.cmd ci --ignore-scripts

      - name: Run full CI gates
        shell: powershell
        run: .\scripts\ci.ps1
